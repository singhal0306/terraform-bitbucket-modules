repos:
  - repo: https://github.com/google/yapf
    rev: v0.40.2
    hooks:
      - id: yapf
        args: [--style, .style.yapf]

  - repo: local
    hooks:
      - id: versions
        name: Check Terraform module versions
        entry: bash -c 'set -eu; for file in modules/*/versions.tf; do diff -I "[[:space:]]*module_name" -ub default-versions.tf "$file"; done'
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint, --no-warnings]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell