values:
  module.project.bitbucket_branch_restriction.this["service-a/0"]:
    kind: push
    pattern: main
    repository: service-a
    value: 1
  module.project.bitbucket_project.this:
    key: CORE
    name: Core Platform
    owner: my-workspace
  module.project.bitbucket_project_branching_model.this[0]:
    project: CORE
    workspace: my-workspace
  module.project.bitbucket_project_default_reviewers.this[0]:
    project: CORE
    reviewers:
      - "{user-uuid}"
    workspace: my-workspace
  module.project.bitbucket_project_group_permission.this[developers]:
    group_slug: developers
    permission: write
    project_key: CORE
    workspace: my-workspace
  module.project.bitbucket_project_user_permission.this["{user-uuid}"]:
    permission: read
    project_key: CORE
    user_id: "{user-uuid}"
    workspace: my-workspace
  module.project.bitbucket_repository.this["service-a"]:
    description: Core service repository.
    is_private: true
    name: service-a
    owner: my-workspace
    project_key: CORE
  module.project.bitbucket_repository_group_permission.this["service-a/developers"]:
    group_slug: developers
    permission: write
    repo_slug: service-a
    workspace: my-workspace

counts:
  bitbucket_branch_restriction: 1
  bitbucket_project: 1
  bitbucket_project_branching_model: 1
  bitbucket_project_default_reviewers: 1
  bitbucket_project_group_permission: 1
  bitbucket_project_user_permission: 1
  bitbucket_repository: 1
  bitbucket_repository_group_permission: 1
